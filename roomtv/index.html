<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS 3D room with a live TV</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }

  /* The "camera lens": perspective sets the field of view. */
  #viewport { position: fixed; inset: 0; perspective: 500px; overflow: hidden; touch-action: none; cursor: grab; }
  #viewport:active { cursor: grabbing; }

  /* Everything in the room hangs off this element; moving it moves the camera. */
  #camera { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }

  /* Room is 800 wide x 400 high x 800 deep, centred on the origin. */
  .wall { position: absolute; width: 800px; height: 400px; margin: -200px 0 0 -400px;
          background-color: #5f5e5a;
          background-image: linear-gradient(#444441 2px, transparent 2px), linear-gradient(90deg, #444441 2px, transparent 2px);
          background-size: 100px 50px; }
  .wall.side { background-color: #4a4946; }
  .slab { position: absolute; width: 800px; height: 800px; margin: -400px 0 0 -400px; }
  .floor { background-color: #412402;
           background-image: linear-gradient(#633806 2px, transparent 2px), linear-gradient(90deg, #633806 2px, transparent 2px);
           background-size: 80px 80px; }
  .ceiling { background-color: #2c2c2a; }

  /* The TV is an ordinary child of the back wall. */
  .tv { position: absolute; left: 240px; top: 90px; width: 320px; height: 180px;
        background: #000; border: 10px solid #1a1a1a; border-radius: 6px; box-shadow: 0 0 40px rgba(120, 170, 255, 0.25); }
  .tv img, .tv canvas { display: block; width: 100%; height: 100%; object-fit: cover; }

  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
         display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
  #status { font-size: 13px; line-height: 1.4; background: rgba(0, 0, 0, 0.55); padding: 8px 10px; border-radius: 8px; max-width: 60%; }
  #pad { display: flex; gap: 8px; pointer-events: auto; }
  #pad button { width: 52px; height: 52px; font-size: 22px; color: #ddd; background: rgba(0, 0, 0, 0.55);
                border: 1px solid #666; border-radius: 10px; touch-action: manipulation; }
  #pad button:active { background: rgba(255, 255, 255, 0.2); }
</style>
</head>
<body>

<div id="viewport">
  <div id="camera">
    <div class="wall" style="transform: translateZ(-400px)">
      <div class="tv" id="tv"><img id="feed" alt="Live stream"></div>
    </div>
    <div class="wall side" style="transform: rotateY(90deg) translateZ(-400px)"></div>
    <div class="wall side" style="transform: rotateY(-90deg) translateZ(-400px)"></div>
    <div class="wall" style="transform: rotateY(180deg) translateZ(-400px)"></div>
    <div class="slab floor" style="transform: rotateX(90deg) translateZ(-200px)"></div>
    <div class="slab ceiling" style="transform: rotateX(-90deg) translateZ(-200px)"></div>
  </div>
</div>

<div id="hud">
  <div id="status">Drag to look. Arrow keys or WASD to move.</div>
  <div id="pad">
    <button id="back" aria-label="Step back">&#8595;</button>
    <button id="fwd" aria-label="Step forward">&#8593;</button>
  </div>
</div>

<script>
  // Change this to your camera's stream. Append ?src=URL to the page address to override it.
  var STREAM_URL = 'https://filesamples.com/samples/video/mjpeg/sample_1280x720.mjpeg';

  var PERSPECTIVE = 500;   // must match #viewport perspective
  var LIMIT = 320;         // how far the camera may move from the room centre

  var camera = document.getElementById('camera');
  var viewport = document.getElementById('viewport');
  var statusEl = document.getElementById('status');
  var feed = document.getElementById('feed');

  var yaw = 20, x = 0, z = 120;   // degrees, px, px

  function render() {
    camera.style.transform =
      'translateZ(' + PERSPECTIVE + 'px) rotateY(' + yaw + 'deg) translate3d(' + (-x) + 'px, 0, ' + (-z) + 'px)';
  }

  function clamp(v) { return Math.max(-LIMIT, Math.min(LIMIT, v)); }

  function move(forward, strafe) {
    var r = yaw * Math.PI / 180;
    x = clamp(x + Math.sin(r) * forward + Math.cos(r) * strafe);
    z = clamp(z - Math.cos(r) * forward + Math.sin(r) * strafe);
    render();
  }

  // Drag to look
  var dragging = false, lastX = 0;
  viewport.addEventListener('pointerdown', function (e) { dragging = true; lastX = e.clientX; viewport.setPointerCapture(e.pointerId); });
  viewport.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.3;
    lastX = e.clientX;
    render();
  });
  viewport.addEventListener('pointerup', function () { dragging = false; });
  viewport.addEventListener('pointercancel', function () { dragging = false; });

  // Keyboard: held keys move smoothly
  var keys = {};
  window.addEventListener('keydown', function (e) { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  function tick() {
    var f = 0, s = 0, turn = 0;
    if (keys['w'] || keys['arrowup']) f += 6;
    if (keys['s'] || keys['arrowdown']) f -= 6;
    if (keys['a']) s -= 6;
    if (keys['d']) s += 6;
    if (keys['arrowleft']) turn -= 2;
    if (keys['arrowright']) turn += 2;
    if (turn) { yaw += turn; render(); }
    if (f || s) move(f, s);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Touch buttons
  document.getElementById('fwd').addEventListener('click', function () { move(60, 0); });
  document.getElementById('back').addEventListener('click', function () { move(-60, 0); });

  // If the stream can't be shown, draw a stand-in so the TV isn't blank.
  var fellBack = false;
  function fallback() {
    if (fellBack) return;
    fellBack = true;
    var c = document.createElement('canvas');
    c.width = 320; c.height = 180;
    document.getElementById('tv').replaceChild(c, feed);
    statusEl.textContent = 'Stream did not load, showing a stand-in. Drag to look, arrows or WASD to move.';
    var g = c.getContext('2d');
    var bars = ['#d3d1c7', '#ef9f27', '#5dcaa5', '#97c459', '#d4537e', '#e24b4a', '#378add'];
    (function draw(t) {
      for (var i = 0; i < 7; i++) { g.fillStyle = bars[i]; g.fillRect(i * 320 / 7, 0, 320 / 7 + 1, 180); }
      g.fillStyle = '#000';
      g.fillRect(((t || 0) / 8) % 400 - 80, 0, 60, 180);
      g.fillRect(0, 130, 320, 50);
      g.fillStyle = '#fff'; g.font = '20px monospace';
      g.fillText('NO SIGNAL ' + new Date().toLocaleTimeString(), 14, 162);
      requestAnimationFrame(draw);
    })();
  }

  var override = new URLSearchParams(location.search).get('src');
  feed.addEventListener('error', fallback);
  feed.src = override || STREAM_URL;
  setTimeout(function () { if (!feed.naturalWidth) fallback(); }, 6000);

  render();
</script>
</body>
</html>
